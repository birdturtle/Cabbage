name: Linux package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev pkg-config libfuse2 patchelf librsvg2-bin
      - name: Set up Rust
        run: rustup update stable
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked --manifest-path game-host/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build AppImage
        run: npm run build -- --bundles appimage
      - name: Verify AppImage contents
        run: |
          image=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$image"
          mkdir build-smoke
          cd build-smoke
          "../$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/cabbage-launcher
          test -f squashfs-root/Cabbage.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Cabbage-Linux-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
