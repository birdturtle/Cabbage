name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [feature/multi-client-launcher]
permissions:
  contents: read
jobs:
  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native installation scripts
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        run: rustup update stable
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked --manifest-path game-host/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build standalone executable
        run: npm run build -- --no-bundle
      - name: Prepare download
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path build/windows -Force | Out-Null
          Copy-Item src-tauri/target/release/cabbage-launcher.exe "build/windows/Cabbage-Windows-x64-$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Cabbage-Windows-x64
          path: build/windows/*.exe
          if-no-files-found: error
