name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev pkg-config
      - name: Set up Rust
        run: rustup update stable
      - name: Install frontend tools
        run: npm ci
      - name: Check frontend and isolation
        run: npm run check
      - name: Test game host
        run: cargo test --locked --manifest-path game-host/Cargo.toml
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
