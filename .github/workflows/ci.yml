name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev pkg-config
      - name: Set up Rust
        run: rustup update stable
      - name: Install frontend tools
        run: npm ci
      - name: Check frontend and isolation
        run: npm run check
      - name: Test dependency helper
        run: cargo test --locked --manifest-path dependency-helper/Cargo.toml
      - name: Test game host
        run: cargo test --locked --manifest-path game-host/Cargo.toml
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  apt-packages:
    name: Dependency packages (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            alsa: libasound2
          - image: debian:13
            alsa: libasound2t64
          - image: ubuntu:22.04
            alsa: libasound2
          - image: ubuntu:24.04
            alsa: libasound2t64
    container: ${{ matrix.image }}
    steps:
      - name: Verify dependency transaction without installing packages
        run: |
          apt-get update --error-on=any
          apt-get --simulate install --no-remove --reinstall -- wine libsdl2-2.0-0 libegl1 libopengl0 libgl1 xwayland gnome-keyring libx11-6 libxext6 libxi6 libxrender1 libxtst6 libfreetype6 libfontconfig1 ${{ matrix.alsa }}

  fedora-packages:
    name: Dependency packages (Fedora ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['43', '44']
    container: fedora:${{ matrix.version }}
    steps:
      - name: Verify repository package availability without installing
        run: |
          dnf --refresh makecache
          for package in wine sdl2-compat libglvnd-egl libglvnd-opengl libglvnd-glx xorg-x11-server-Xwayland gnome-keyring libX11 libXext libXi libXrender libXtst freetype fontconfig alsa-lib; do
            dnf repoquery --available --queryformat '%{name}' "$package.x86_64" > /tmp/cabbage-package-query
            if ! grep -Fxq "$package" /tmp/cabbage-package-query; then
              echo "Missing dependency package: $package"
              exit 1
            fi
          done
      - name: Exercise DNF install parsing and reject the transaction
        env:
          LC_ALL: C
        run: |
          if printf 'n\n' | dnf --refresh --setopt=assumeyes=False --setopt=assumeno=False install wine.x86_64 sdl2-compat.x86_64 libglvnd-egl.x86_64 libglvnd-opengl.x86_64 libglvnd-glx.x86_64 xorg-x11-server-Xwayland.x86_64 gnome-keyring.x86_64 libX11.x86_64 libXext.x86_64 libXi.x86_64 libXrender.x86_64 libXtst.x86_64 freetype.x86_64 fontconfig.x86_64 alsa-lib.x86_64 > /tmp/cabbage-dnf-install.log 2>&1; then
            cat /tmp/cabbage-dnf-install.log
            echo "Expected the transaction to be declined"
            exit 1
          fi
          cat /tmp/cabbage-dnf-install.log
          grep -Fq 'Transaction Summary' /tmp/cabbage-dnf-install.log
          if rpm -q wine; then
            echo "The cancelled transaction installed Wine"
            exit 1
          fi
      - name: Verify reinstall command syntax
        run: dnf --refresh --setopt=assumeyes=False --setopt=assumeno=False reinstall --help

  opensuse-packages:
    name: Dependency transaction (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['opensuse/tumbleweed:latest', 'opensuse/leap:16.0']
    container: ${{ matrix.image }}
    steps:
      - name: Verify Zypper parser and resolve dependencies without installing
        run: |
          zypper refresh
          zypper --non-interactive install --dry-run --force --no-allow-vendor-change wine gnome-keyring xwayland 'libSDL2-2.0.so.0()(64bit)' 'libEGL.so.1()(64bit)' 'libOpenGL.so.0()(64bit)' 'libGL.so.1()(64bit)' 'libX11.so.6()(64bit)' 'libXext.so.6()(64bit)' 'libXi.so.6()(64bit)' 'libXrender.so.1()(64bit)' 'libXtst.so.6()(64bit)' 'libfreetype.so.6()(64bit)' 'libfontconfig.so.1()(64bit)' 'libasound.so.2()(64bit)'
