[package]
name = "cabbage-launcher"
version = "0.1.0-rc.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cabbage-game-host = { path = "../game-host" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
aes-gcm = "0.10"
zeroize = "1"
semver = "1"
x509-parser = "0.18"
flate2 = "1"
lzma-rs = "0.3"
crc32fast = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"
webkit2gtk = "2.0"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.dev]
debug = 0
incremental = false
